services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: models/crop_disease_cnn.onnx
      CLASSES_PATH: models/classes.json
      ONNX_PROVIDERS: '["CPUExecutionProvider"]'
      # GPU: ONNX_PROVIDERS: '["CUDAExecutionProvider","CPUExecutionProvider"]'
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: INFO
    # GPU support (requires the GPU Dockerfile, see backend/Dockerfile):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/my-app
      args:
        # Browser-facing URLs (the browser talks to the backend directly)
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
